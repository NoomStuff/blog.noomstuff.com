<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Redirecting to Latest Post...</title>
    <link rel="icon" href="https://noomstuff.com/media/favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Latest Post - NoomStuff's Blog">
    <meta property="og:description" content="What could it be? Read the latest post on my Blog.">
    <meta property="og:image" content="https://blog.noomstuff.com/latest/social-preview.png">
    <meta property="og:type" content="article">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Latest Post - NoomStuff's Blog">
    <meta name="twitter:description" content="What could it be? Read the latest post on my Blog.">
    <meta name="twitter:image" content="https://blog.noomstuff.com/latest/social-preview.png">
    <meta name="twitter:creator" content="@NoomStuff">

    <script>
        fetch('/latest.json')
            .then(res => res.json())
            .then(post => location.href = post.url)
            .catch(() => location.href = '/');
    </script>
</head>

<body style="background-color: black; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <p><b>Redirecting to the latest post...</b></p>
</body>

</html>
